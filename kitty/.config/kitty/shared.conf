# Shared Kitty config for Linux and macOS.

# Use fish consistently on both platforms and start it as a login shell so it
# reads the expected startup files when Kitty is launched from a GUI session.
shell fish --login --interactive
shell_integration enabled
tab_bar_edge top

# Colors come from kitty's built-in themes (kitty +kitten themes), which
# writes a per-machine current-theme.conf that stays out of this repo.

# Tab bar: replace the default "fade" style with clean slanted tabs
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"
active_tab_font_style bold
inactive_tab_font_style normal
