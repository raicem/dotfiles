# Shared Kitty config for Linux and macOS.

# Use fish consistently on both platforms and start it as a login shell so it
# reads the expected startup files when Kitty is launched from a GUI session.
shell fish --login --interactive
shell_integration enabled
tab_bar_edge top

# Tokyo Night (night - matches nvim tokyonight-night)
foreground #c0caf5
background #1a1b26
selection_foreground #c0caf5
selection_background #283457
cursor #c0caf5
cursor_text_color #1a1b26

color0  #15161e
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #a9b1d6
color8  #414868
color9  #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5
